<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>贵州方言 ASR 机器初标</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f9;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --text: #15202b;
      --muted: #5d6b78;
      --border: #dbe3e8;
      --accent: #087f8c;
      --accent-dark: #076872;
      --accent-soft: #e4f5f6;
      --success: #237a57;
      --success-soft: #e8f5ee;
      --error: #b42318;
      --error-soft: #fff0ee;
      --warning: #945d00;
      --warning-soft: #fff5dc;
      --shadow: 0 1px 3px rgb(15 23 42 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
    }

    audio { font: inherit; }

    audio:focus-visible,
    a:focus-visible {
      outline: 3px solid rgb(8 127 140 / 28%);
      outline-offset: 3px;
    }

    .page-shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    .page-header {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent-dark);
      font-size: 0.875rem;
      font-weight: 750;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.35rem);
      line-height: 1.15;
      text-wrap: balance;
    }

    .lede {
      max-width: 860px;
      margin: 0;
      color: var(--muted);
      text-wrap: pretty;
    }

    .secondary-link {
      width: fit-content;
      color: var(--accent-dark);
      font-size: 0.875rem;
      font-weight: 700;
      text-underline-offset: 4px;
    }

    .notice {
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid #f1c56a;
      border-radius: 10px;
      background: var(--warning-soft);
      color: #6e4700;
      text-wrap: pretty;
    }

    .notice strong { color: var(--warning); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 22px;
    }

    .metric {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .metric dt {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.8125rem;
    }

    .metric dd {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 750;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    .results-list {
      display: grid;
      gap: 14px;
    }

    .result-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px 20px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-muted);
    }

    .sample-heading {
      min-width: 0;
      margin: 0;
      font-size: 1rem;
      line-height: 1.5;
      text-wrap: balance;
    }

    .file-name {
      display: block;
      max-width: min(72vw, 680px);
      overflow: hidden;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-size: 0.75rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .badge.failed {
      background: var(--error-soft);
      color: var(--error);
    }

    .card-body {
      display: grid;
      grid-template-columns: minmax(240px, 0.72fr) minmax(0, 1.8fr);
      gap: 20px;
      padding: 18px;
    }

    .audio-panel {
      align-self: start;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-muted);
    }

    .section-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 750;
    }

    audio {
      display: block;
      width: 100%;
      min-height: 40px;
    }

    .audio-error,
    .transcription-error {
      margin: 8px 0 0;
      color: var(--error);
      font-size: 0.8125rem;
    }

    .audio-meta,
    .request-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }

    .transcript-panel { min-width: 0; }

    .transcript-text {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 1.05rem;
      line-height: 1.95;
      text-wrap: pretty;
    }

    .model-config {
      margin: 22px 0 0;
      padding: 14px 16px;
      border-left: 4px solid var(--accent);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    .state-panel {
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    .state-panel.error {
      border-color: #f0aaa3;
      background: var(--error-soft);
      color: var(--error);
    }

    .loading-stack { display: grid; gap: 12px; }

    .loading-block {
      min-height: 150px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card-body { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .page-shell {
        width: min(100% - 20px, 1120px);
        padding-top: 24px;
      }
      .summary-grid { grid-template-columns: 1fr; }
      .card-header,
      .card-body { padding: 14px; }
      .file-name { max-width: 82vw; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">科大讯飞方言识别大模型 · 原始输出</p>
      <h1>贵州方言 ASR 机器初标</h1>
      <p class="lede" id="dataset-description">正在加载真实贵州方言录音和转写结果……</p>
      <a class="secondary-link" href="guizhou-eval.html">查看原来的26条贵州口音普通话评测</a>
    </header>

    <aside class="notice" id="notice" hidden>
      <strong>注意：</strong><span id="notice-text"></span>
    </aside>

    <dl class="summary-grid" id="summary" aria-label="数据汇总" hidden></dl>

    <div class="loading-stack" id="loading" role="status" aria-label="正在加载贵州方言转写结果">
      <div class="loading-block"></div>
      <div class="loading-block"></div>
    </div>

    <section class="results-list" id="results" aria-label="逐条贵州方言机器初标"></section>
    <div class="state-panel error" id="load-error" role="alert" hidden></div>
    <div class="state-panel" id="empty-state" hidden>暂无可展示的转写结果，请检查数据文件后刷新页面。</div>

    <aside class="model-config" id="model-config" hidden></aside>
  </main>

  <script>
    const DATA_URL = "guizhou_dialect/results.json";

    const summaryEl = document.getElementById("summary");
    const resultsEl = document.getElementById("results");
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("load-error");
    const emptyEl = document.getElementById("empty-state");
    const descriptionEl = document.getElementById("dataset-description");
    const noticeEl = document.getElementById("notice");
    const noticeTextEl = document.getElementById("notice-text");
    const modelConfigEl = document.getElementById("model-config");

    function formatSeconds(value) {
      return `${Number(value).toFixed(2)} 秒`;
    }

    function buildSummary(summary) {
      const metrics = [
        ["音频样本", `${summary.samples} 条`],
        ["成功转写", `${summary.successes} / ${summary.samples}`],
        ["音频总时长", formatSeconds(summary.totalAudioSeconds)],
        ["平均识别耗时", formatSeconds(summary.averageElapsedSeconds)]
      ];
      summaryEl.replaceChildren(...metrics.map(([label, value]) => {
        const metric = document.createElement("div");
        metric.className = "metric";
        const term = document.createElement("dt");
        term.textContent = label;
        const description = document.createElement("dd");
        description.textContent = value;
        metric.append(term, description);
        return metric;
      }));
    }

    function appendMeta(container, values) {
      values.forEach((value) => {
        const item = document.createElement("span");
        item.textContent = value;
        container.append(item);
      });
    }

    function buildResultCard(result, index, total) {
      const success = result.status === "success";
      const card = document.createElement("article");
      card.className = "result-card";

      const header = document.createElement("header");
      header.className = "card-header";
      const heading = document.createElement("h2");
      heading.className = "sample-heading";
      heading.textContent = `样本 ${index + 1} / ${total}`;
      const fileName = document.createElement("span");
      fileName.className = "file-name";
      fileName.title = result.fileName;
      fileName.textContent = result.fileName;
      heading.append(fileName);
      const badge = document.createElement("span");
      badge.className = `badge${success ? "" : " failed"}`;
      badge.textContent = success ? "转写成功" : "转写失败";
      header.append(heading, badge);

      const body = document.createElement("div");
      body.className = "card-body";

      const audioPanel = document.createElement("div");
      audioPanel.className = "audio-panel";
      const audioLabel = document.createElement("span");
      audioLabel.className = "section-label";
      audioLabel.textContent = "电话录音（浏览器兼容播放副本）";
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "none";
      audio.src = result.audio;
      audio.setAttribute("aria-label", `播放贵州方言样本 ${index + 1}`);
      const audioError = document.createElement("p");
      audioError.className = "audio-error";
      audioError.hidden = true;
      audioError.textContent = "音频加载失败，请刷新页面后重试。";
      audio.addEventListener("error", () => { audioError.hidden = false; }, { once: true });
      const audioMeta = document.createElement("p");
      audioMeta.className = "audio-meta";
      appendMeta(audioMeta, [
        formatSeconds(result.audioSeconds),
        result.sourceAudioFormat,
        result.playbackFormat
      ]);
      audioPanel.append(audioLabel, audio, audioError, audioMeta);

      const transcriptPanel = document.createElement("div");
      transcriptPanel.className = "transcript-panel";
      const transcriptLabel = document.createElement("span");
      transcriptLabel.className = "section-label";
      transcriptLabel.textContent = "讯飞机器初标（未经人工校对）";
      transcriptPanel.append(transcriptLabel);
      if (success) {
        const transcript = document.createElement("p");
        transcript.className = "transcript-text";
        transcript.textContent = result.hypothesis;
        transcriptPanel.append(transcript);
      } else {
        const transcriptionError = document.createElement("p");
        transcriptionError.className = "transcription-error";
        transcriptionError.textContent = result.errorMessage || "科大讯飞未返回有效结果。";
        transcriptPanel.append(transcriptionError);
      }
      const requestMeta = document.createElement("p");
      requestMeta.className = "request-meta";
      appendMeta(requestMeta, [
        `成功请求耗时 ${formatSeconds(result.elapsedSeconds)}`,
        `实际请求 ${result.attempts} 次`
      ]);
      transcriptPanel.append(requestMeta);

      body.append(audioPanel, transcriptPanel);
      card.append(header, body);
      return card;
    }

    function validateData(data) {
      if (!data || !data.metadata || !data.summary || !Array.isArray(data.results)) {
        throw new Error("数据结构不完整");
      }
      if (data.results.length !== data.summary.samples) {
        throw new Error("汇总数量与明细数量不一致");
      }
      const ids = new Set(data.results.map((result) => result.id));
      if (ids.size !== data.results.length) throw new Error("样本 ID 重复");
    }

    fetch(DATA_URL, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((data) => {
        validateData(data);
        buildSummary(data.summary);
        descriptionEl.textContent = `${data.metadata.dataset}。识别模型：${data.metadata.provider}。`;
        noticeTextEl.textContent = data.metadata.notice;
        modelConfigEl.textContent = `模型配置：${data.metadata.modelConfig}。生成日期：${data.metadata.generatedAt}。`;
        resultsEl.replaceChildren(...data.results.map((result, index) => (
          buildResultCard(result, index, data.results.length)
        )));
        loadingEl.hidden = true;
        noticeEl.hidden = false;
        summaryEl.hidden = false;
        modelConfigEl.hidden = false;
        emptyEl.hidden = data.results.length !== 0;
      })
      .catch((error) => {
        loadingEl.hidden = true;
        errorEl.hidden = false;
        errorEl.textContent = `结果加载失败：${error.message}。请刷新页面重试。`;
        descriptionEl.textContent = "贵州方言转写数据暂时无法加载。";
      });
  </script>
</body>
</html>
