events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl;
        server_name 192.168.173.167;

        ssl_certificate /etc/nginx/tls/asr-ip.pem;
        ssl_certificate_key /etc/nginx/tls/asr-ip.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            return 302 /accuracy_ae_demo.html;
        }

        location = /accuracy_ae_demo.html {
            proxy_pass https://127.0.0.1:8443/accuracy_ae_demo.html;
            include /etc/nginx/proxy_params.conf;
        }

        location = /accuracy_ae_transcript.js {
            proxy_pass https://127.0.0.1:8443/accuracy_ae_transcript.js;
            include /etc/nginx/proxy_params.conf;
        }

        location = /asr-accuracy-a {
            proxy_pass https://127.0.0.1:8443/asr-accuracy-a;
            include /etc/nginx/proxy_params.conf;
        }

        location = /asr {
            proxy_pass https://127.0.0.1:8443/asr;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            return 404;
        }
    }
}
